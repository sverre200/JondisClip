[workspace]
resolver = "3"
members = ["crates/core", "crates/engine", "crates/app", "crates/export", "ui/src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "Proprietary"
publish = false

[workspace.dependencies]
thiserror = "2"
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format"] }

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

# bindgen (ffmpeg-sys-next's build script) can overflow the 1 MB main-thread
# stack on Windows when built unoptimised with feature-unified deps (seen when
# the Tauri UI crate is in the same build). Optimised build scripts use far
# less stack.
[profile.dev.build-override]
opt-level = 2

[profile.release.build-override]
opt-level = 2
